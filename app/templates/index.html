<!DOCTYPE html>
<html>
<head>
<title>AI Phishing Detector</title>

<style>
body {
    margin:0;
    font-family:Segoe UI;
    background: linear-gradient(135deg,#1d2671,#c33764);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card {
    background:white;
    padding:30px;
    width:420px;
    border-radius:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
    text-align:center;
    animation:fadeIn 0.8s ease;
}

textarea {
    width:100%;
    height:120px;
    border-radius:10px;
    padding:10px;
    border:2px solid #ddd;
}

button {
    margin-top:15px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#4a6cf7;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover { background:#2c4df0; }

.result {
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
}

.bar {
    height:8px;
    border-radius:10px;
    margin-top:10px;
}

.reasons span {
    background:#eee;
    padding:5px 10px;
    margin:5px;
    display:inline-block;
    border-radius:10px;
    font-size:12px;
}

a {
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#4a6cf7;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
</style>

</head>

<body>

<div class="card">
    <h2>🛡 AI Phishing Detector</h2>

    <form action="/predict" method="POST">
        <textarea name="email" placeholder="Paste email content..."></textarea>
        <button type="submit">Analyze Email</button>
    </form>

    {% if result %}
        <div class="result" style="color:{{color}}">
            {{result}}
        </div>

        <div class="bar" style="background:{{color}}; width:{{confidence}}%;"></div>

        <p>Confidence: {{confidence}}%</p>
        <p>Risk Level: <b>{{risk}}</b></p>

        <div class="reasons">
            {% for r in reasons %}
                <span>{{r}}</span>
            {% endfor %}
        </div>
    {% endif %}

    <a href="/dashboard">📊 View Dashboard</a>
</div>

</body>
</html>
